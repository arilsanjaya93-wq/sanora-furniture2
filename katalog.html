<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog SANORA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
padding:30px;
text-align:center;
background:#111;
color:white;
}

header h1{
color:#d8b36a;
}

.products{
padding:50px;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(320px,1fr));

gap:30px;
}

.card{

background:white;

border-radius:20px;

overflow:hidden;

text-decoration:none;
color:black;

box-shadow:
0 10px 25px rgba(0,0,0,.1);

transition:.3s;
}

.card:hover{

transform:translateY(-10px);

box-shadow:
0 20px 40px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:280px;
object-fit:cover;

transition:.5s;
}

.card:hover img{
transform:scale(1.05);
}

.card-content{
padding:20px;
}

.card h2{
margin-bottom:10px;
}

.price{
color:#caa56a;
font-size:24px;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<h1>KATALOG SANORA</h1>

<p>
Premium Sofa Collection
</p>

</header>

<section class="products">

<a class="card" href="sofa-plus.html">

<img src="images/7.png">

<div class="card-content">

<h2>Sofa PLUS</h2>

<div class="price">
Rp10.600.000
</div>

</div>

</a>

<a class="card" href="sofa71.html">

<img src="images/1.png">

<div class="card-content">

<h2>71 Three-Person Sofa 2 PD</h2>

<div class="price">
Rp11.500.000
</div>

</div>

</a>

</section>

</body>
</html>
