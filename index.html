<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SANORA Furniture</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
}

/* HERO */

.hero{
    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #0f0f0f 0%,
    #1b1b1b 50%,
    #2b241d 100%
    );

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";

    position:absolute;

    width:700px;
    height:700px;

    top:-200px;
    right:-150px;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.15),
        transparent 70%
    );

    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:900px;
    padding:20px;
}

/* LOGO */

.logo{
    width:260px;
    max-width:90%;
    margin-bottom:30px;

    border-radius:15px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.5);
}

/* TITLE */

.hero h1{
    font-size:72px;
    font-weight:800;
    margin-bottom:15px;
}

.hero p{
    font-size:24px;
    color:#d4af37;
    margin-bottom:40px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    background:#d4af37;
    color:#111;

    text-decoration:none;

    padding:18px 42px;

    border-radius:50px;

    font-weight:bold;
    font-size:18px;

    transition:.3s;
}

.btn:hover{
    background:#e8c76a;
    transform:translateY(-4px);
}

/* FOOTER */

footer{
    background:#0c0c0c;
    text-align:center;
    padding:30px 20px;
}

footer p{
    color:#999;
    margin:5px 0;
}

/* MOBILE */

@media(max-width:768px){

.hero h1{
    font-size:48px;
}

.hero p{
    font-size:18px;
}

.logo{
    width:180px;
}

.btn{
    width:220px;
}

}

</style>

</head>

<body>

<section class="hero">

<div class="hero-content">

<img
src="images/Logo.png"
alt="SANORA Furniture"
class="logo">

<h1>SANORA Furniture</h1>

<p>
Crafting Comfort, Creating Home
</p>

<div class="buttons">

<a href="katalog.html" class="btn">
KATALOG
</a>

<a
href="https://wa.me/6282346350129"
target="_blank"
class="btn">
WHATSAPP
</a>

<a
href="https://instagram.com/sanorafurniture"
target="_blank"
class="btn">
INSTAGRAM
</a>

</div>

</div>

</section>

<footer>

<p>
Bulukumba, Sulawesi Selatan, Indonesia
</p>

<p>
WhatsApp : 0823-4635-0129
</p>

</footer>

</body>
</html>
