<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANORA Furniture</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
}

/* HERO SECTION */

.hero{
    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #111111,
    #1b1b1b,
    #2c241d
    );

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    color:white;

    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";

    position:absolute;

    width:700px;
    height:700px;

    background:
    radial-gradient(
    circle,
    rgba(212,175,55,.15),
    transparent 70%
    );

    top:-200px;
    right:-150px;

    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:900px;
    padding:20px;
}

.logo{
    width:220px;
    border-radius:10px;
    margin-bottom:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.hero h1{
    font-size:72px;
    font-weight:800;
    margin-bottom:15px;
}

.hero p{
    font-size:24px;
    color:#d4af37;
    margin-bottom:40px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    background:#d4af37;
    color:#111;

    padding:16px 40px;

    border-radius:40px;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;
}

.btn:hover{
    background:#e8c76a;
    transform:translateY(-3px);
}

/* FOOTER */

footer{
    background:#0d0d0d;
    padding:30px;
    text-align:center;
    color:#aaa;
}

@media(max-width:768px){

.hero h1{
    font-size:48px;
}

.hero p{
    font-size:18px;
}

.logo{
    width:170px;
}

}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<img src="images/logo.png" alt="SANORA Furniture" class="logo">

<h1>SANORA Furniture</h1>

<p>
Crafting Comfort, Creating Home
</p>

<div class="buttons">

<a href="katalog.html" class="btn">
KATALOG
</a>

<a href="https://wa.me/628xxxxxxxxxx" class="btn">
WHATSAPP
</a>

<a href="https://instagram.com/sanorafurniture" class="btn">
INSTAGRAM
</a>

</div>

</div>

</section>

<footer>

<p>
Bulukumba, Sulawesi Selatan, Indonesia
</p>

<p>
WhatsApp: +62 xxx xxxx xxxx
</p>

</footer>

</body>
</html>
